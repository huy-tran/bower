<script type="application/json" id="meta">{"duration": 2600, "tracks": {"tagline": {"props": {"opacity": [[800, 0], [1500, 1, "outQuint"], [2150, 1], [2600, 0, "inCubic"]], "y": [[800, 24], [1500, 0, "outQuint"]]}}}, "params": {"headline": {"type": "text", "value": "Meet Acme", "label": "Headline"}, "ink": {"type": "color", "value": "#0a0a0a", "label": "Headline colour"}, "lift": {"type": "number", "value": 90, "min": 0, "max": 200, "step": 5, "unit": "px", "label": "Letter rise"}}}</script>
<style>
  .intro-word {
    position: absolute; left: 0; right: 0; top: 380px; text-align: center;
    font: 800 220px/1 Inter, sans-serif; letter-spacing: -0.06em; color: var(--ve-ink, #0a0a0a);
  }
  .intro-word span { display: inline-block; will-change: transform, opacity; }
  .intro-tag {
    position: absolute; left: 0; right: 0; top: 650px; text-align: center;
    font: 500 40px/1 Inter, sans-serif; letter-spacing: -0.02em; color: #71717a;
  }
</style>
<div class="intro-word" data-ve-param="headline"></div>
<div class="intro-tag" data-ve-id="tagline" data-ve-name="Tagline">A UI kit for calm, careful interfaces</div>
<script>
  const word = VE.$('.intro-word')

  // One span per letter of the headline, rebuilt when the headline setting changes.
  let built = null, letters = []
  function build(text) {
    built = text
    word.textContent = ''
    letters = text.split('').map(ch => {
      const s = document.createElement('span')
      s.textContent = ch === ' ' ? ' ' : ch
      word.appendChild(s)
      return s
    })
  }

  VE.scene({
    render(t) {
      const headline = VE.param('headline', 'Meet Acme')
      if (headline !== built) build(headline)
      const lift = VE.param('lift', 90)
      letters.forEach((el, i) => {
        const p = VE.progress(t, VE.stagger(i, 45, 100), 700, 'outExpo')
        el.style.opacity = p
        el.style.transform = 'translateY(' + (1 - p) * lift + 'px) rotate(' + (1 - p) * 6 + 'deg)'
      })
      // The tagline moves with keyframes ("tracks" in the meta block), so it can be retimed in the editor.

      // Lift out towards the next scene.
      const out = VE.progress(t, 2150, 450, 'inCubic')
      word.style.transform = 'translateY(' + (-out * 60) + 'px)'
      word.style.filter = 'blur(' + out * 10 + 'px)'
      word.style.opacity = 1 - out
    }
  })
</script>
