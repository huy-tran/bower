# Builds the Windows desktop app. A pushed `v*` tag (matching package.json's version) uploads the
# installer and update files to a draft GitHub release; publishing that draft is what makes
# installed apps update. A manual run only builds and keeps the installer as a workflow artifact.
#
# Builds are unsigned (internal tool, Windows team). To sign later, add the repository secrets
# WIN_CSC_LINK (base64 .pfx or URL) and WIN_CSC_KEY_PASSWORD. electron-builder.yml also has
# macOS and Linux targets: add macos-latest / ubuntu-latest runners here to build them.
name: Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Also downloads ffmpeg and Puppeteer's Chrome (into .cache/puppeteer).
      - run: npm ci

      - name: Build
        run: npm run build:desktop -- --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: bower-windows
          path: dist-desktop/*.exe
          if-no-files-found: error
