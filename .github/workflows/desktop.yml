# Builds the Windows desktop app. A pushed `v*` tag (matching package.json's version) uploads the
# installer and update files to a draft GitHub release and publishes it once all are there, which
# is what makes installed apps update. A manual run only builds and keeps the installer as a
# workflow artifact.
#
# Builds are unsigned (internal tool, Windows team). To sign later, add the repository secrets
# WIN_CSC_LINK (base64 .pfx or URL) and WIN_CSC_KEY_PASSWORD. electron-builder.yml also has
# macOS and Linux targets: add macos-latest / ubuntu-latest runners here to build them.
name: Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Also downloads ffmpeg and Puppeteer's Chrome (into .cache/puppeteer).
      - run: npm ci

      # The release notes are this version's section of CHANGELOG.md ("## 0.6.0 ..." up to the next "## ").
      # No section, no release: better than a release page (and update dialog) with nothing to say.
      - name: Release notes
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          # Wrapped continuation lines (starting with two spaces) are joined onto their bullet: GitHub shows every
          # line break in a release body as a hard break.
          awk -v v="$v" '
            index($0, "## " v " ") == 1 || $0 == "## " v { on = 1; next }
            /^## / && on { exit }
            on && /^  [^ ]/ { sub(/^ +/, ""); buf = buf " " $0; next }
            on { if (started) print buf; buf = $0; started = 1 }
            END { if (started) print buf }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no '## $v' section. Add one and tag again."
            exit 1
          fi
          cat release-notes.md

      # electron-builder uploads several files at once and, with no release yet, can race into
      # creating two drafts for the same tag. Creating the draft first gives them one to share.
      - name: Create draft release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "${GITHUB_REF_NAME#v}" --notes-file release-notes.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build:desktop -- --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # Published only now, with every file uploaded, so installed apps never see a half-made release.
      - name: Publish release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: bower-windows
          path: dist-desktop/*.exe
          if-no-files-found: error
